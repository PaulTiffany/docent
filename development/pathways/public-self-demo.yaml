pathway_id: public-self-demo
title: Public self-docent demo
intent: Make the project a living bounded docent and a public view of its authored development options.
status: demonstrated
evidence_basis: [Human decision demo-first-2026-08-05, Existing bounded chat and mock provider]
preconditions:
  - capability_id: bounded-single-user-chat
    allowed_statuses: [implemented]
  - capability_id: mock-provider
    allowed_statuses: [implemented]
proposed_changes: [Add development manifests and APIs, Add a self-docent corpus adapter, Build one canonical frontend, Add reproducible Pages and Space deployment]
capabilities_advanced: [public-self-demo, development-pathway-model, docker-packaging]
invariants: [Humans select pathways, No claim of objective optimality, Public evidence only, Incomplete room runtime stays visibly incomplete, Mock mode requires no model secret]
risks: [Public UI may outrun deployment readiness, Self-description may become stale]
