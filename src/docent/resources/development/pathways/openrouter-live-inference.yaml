pathway_id: openrouter-live-inference
title: Capped OpenRouter live inference
intent: Make real bounded synthesis the normal public experience while retaining explicit deterministic corpus mode.
status: active
evidence_basis: [Human directive on 2026-08-05, Existing generic OpenAI-compatible provider and public demo]
preconditions:
  - capability_id: bounded-single-user-chat
    allowed_statuses: [implemented]
  - capability_id: openai-compatible-provider
    allowed_statuses: [implemented]
proposed_changes: [Add typed provider provenance and errors, Add explicit inference modes, Add a process-local daily attempt budget, Update the public client and deployment guidance]
capabilities_advanced: [model-backed-public-chat, configurable-model-selection, explicit-deterministic-mode, provider-provenance, quota-aware-failures, application-inference-budget]
invariants: [Docent controls evidence authorization, Local response validation remains mandatory, No silent fallback, Model choice remains configuration-driven, Provider secrets remain server-side]
risks: [Free routing availability changes externally, Shared allowance can be exhausted, Routed models vary in JSON reliability]
unresolved_uncertainties: [Which routed models answer synthesis questions reliably, Whether live synthesis yields more useful visitor feedback]
reversibility: High; operators can return to mock mode or change the configured model without code changes.
lock_in_implications: Low; OpenRouter uses the generic OpenAI-compatible boundary and is a reference deployment choice.
