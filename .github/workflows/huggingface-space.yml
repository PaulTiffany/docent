name: Synchronize Hugging Face Space

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docent-huggingface-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install official Hub client
        run: python -m pip install huggingface_hub==0.34.4
      - name: Validate and synchronize intended Space contents
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: python deploy/huggingface/sync_space.py
