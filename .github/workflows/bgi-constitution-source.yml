name: Verify BGI Constitution source

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"
      timezone: "America/New_York"

permissions:
  contents: read

concurrency:
  group: bgi-constitution-source
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify canonical Google Doc
        run: python tools/sync_bgi_constitution.py
