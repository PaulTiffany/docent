name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m docent.cli validate
      - run: python -m docent.content_audit
      - run: python -c "from docent.development import validate_main; validate_main()"
      - run: python tools/frontend.py --check
      - run: python tools/resources.py --check
      - run: ruff format --check src tests tools deploy
      - run: ruff check src tests tools deploy
      - run: pytest -q
      - run: python -m build
      - run: python tools/wheel_smoke.py dist/bounded_docent-0.2.0-py3-none-any.whl

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root image
        run: docker build -t docent-ci .
      - name: Start mock production container
        run: >-
          docker run -d --name docent-ci-run -p 7860:7860
          -e DOCENT_ENVIRONMENT=production
          -e DOCENT_PROVIDER=mock
          -e DOCENT_ALLOWED_ORIGINS=https://paultiffany.github.io
          -e DOCENT_ROOM_RESET_ENABLED=false
          docent-ci
      - name: Wait for health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7860/health; then exit 0; fi
            sleep 2
          done
          docker logs docent-ci-run
          exit 1
      - name: Verify unprivileged runtime
        run: test "$(docker inspect -f '{{.Config.User}}' docent-ci-run)" = "docent"
      - name: Stop container
        if: always()
        run: docker rm -f docent-ci-run || true
